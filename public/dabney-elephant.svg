<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Dabney.moe minimalist heraldic elephant crest">
  <!-- Minimalist amusing edit of the Dabney House crests: sweeping emerald elephant with
       deadpan side-eye, round gold glasses, white tusk, and a steaming coffee mug perched
       on its trunk above a crimson shield bearing 3 grumpy golden martlets, a cyan ECG/CGM
       pulse waveform, and 5 ivory diamond lozenges. -->
  <defs>
    <clipPath id="dabney-shield-inner">
      <path d="M 60 112 H 196 V 150 C 196 196 164 224 128 238 C 92 224 60 196 60 150 Z" />
    </clipPath>
  </defs>

  <!-- Sweeping Dabney House minimalist emerald elephant silhouette -->
  <g fill="none" stroke="#116530" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upturned trunk curving right into brow, sweeping into iconic looping ear -->
    <path stroke-width="15" d="M 64 56 C 64 82 88 86 105 80 C 118 75 123 36 154 36 C 180 36 188 54 184 72 C 179 90 152 94 140 82 C 134 75 136 65 144 64" />
    <!-- Neck stems anchoring elephant head to shield top bar -->
    <path stroke-width="14" d="M 103 82 C 114 88 121 97 123 108" />
    <path stroke-width="14" d="M 164 87 L 157 108" />
  </g>

  <!-- Curved ivory tusk -->
  <path d="M 111 84 C 107 93 97 96 89 94 C 96 99 111 98 117 90 Z" fill="#f8f5e6" stroke="#0d4a23" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Deadpan half-lidded eyes + round gold minimalist glasses -->
  <g>
    <!-- Left eye (subtle 3/4 view) -->
    <ellipse cx="106" cy="64" rx="4.2" ry="3.8" fill="#f8f5e6" />
    <circle cx="105" cy="64.5" r="2" fill="#040d1d" />
    <path d="M 101.5 62.5 H 110.5" stroke="#116530" stroke-width="3.2" stroke-linecap="round" />
    <!-- Right eye (deadpan side-eye) -->
    <ellipse cx="122" cy="65" rx="5.2" ry="4.4" fill="#f8f5e6" />
    <circle cx="120.5" cy="65.5" r="2.3" fill="#040d1d" />
    <path d="M 116.5 63 H 127.5" stroke="#116530" stroke-width="3.4" stroke-linecap="round" />
    <!-- Round gold nerd glasses + temple arm -->
    <ellipse cx="105.5" cy="64.5" rx="5.2" ry="7.2" fill="none" stroke="#e5c158" stroke-width="2.2" />
    <circle cx="122" cy="65" r="7.5" fill="none" stroke="#e5c158" stroke-width="2.2" />
    <path d="M 110.7 64.5 H 114.5 M 129.5 65 H 140 C 143 65 144 67 144 69" fill="none" stroke="#e5c158" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Tiny steaming white coffee mug balanced on upturned trunk tip -->
  <g>
    <!-- Steam wisps -->
    <path d="M 60 22 C 58 18 62 15 60 11 M 68 21 C 66 17 70 14 68 10" fill="none" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round" />
    <!-- Mug handle -->
    <path d="M 73 32 C 80 32 80 42 73 42" fill="none" stroke="#f8f5e6" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 73 32 C 80 32 80 42 73 42" fill="none" stroke="#0d4a23" stroke-width="1.1" stroke-linecap="round" />
    <!-- Mug body -->
    <rect x="55" y="28" width="18" height="19" rx="2.5" fill="#f8f5e6" stroke="#0d4a23" stroke-width="1.6" />
  </g>

  <!-- Heraldic shield: bold emerald outer frame + crimson interior -->
  <path
    d="M 50 104 H 206 V 150 C 206 202 170 233 128 248 C 86 233 50 202 50 150 Z"
    fill="#116530"
  />
  <path
    d="M 60 113 H 196 V 150 C 196 196 164 224 128 238 C 92 224 60 196 60 150 Z"
    fill="#b92d1f"
  />

  <!-- Shield charges (clipped cleanly inside the crimson field) -->
  <g clip-path="url(#dabney-shield-inner)">
    <!-- Cyan perch wire -->
    <line x1="72" y1="158" x2="184" y2="158" stroke="#38d9f0" stroke-width="3.4" stroke-linecap="round" />

    <!-- Three deadpan golden martlet birds perched in a row -->
    <g fill="#f2bc2e" stroke="#6b3f07" stroke-width="1.2" stroke-linejoin="round">
      <!-- Bird 1 -->
      <path d="M 80 133 L 85 130 C 90 127 96 130 98 136 L 107 156 L 112 167 L 104 167 L 99 158 C 91 158 84 152 84 142 L 83 136 Z" />
      <path d="M 92 140 L 100 154 M 90 157 L 88 160 M 95 157 L 94 160" fill="none" stroke="#6b3f07" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="89" cy="134.5" r="1.4" fill="#3a2104" stroke="none" />
      <line x1="86.5" y1="133" x2="91.5" y2="133.5" stroke="#3a2104" stroke-width="1.5" stroke-linecap="round" />

      <!-- Bird 2 -->
      <path d="M 116 133 L 121 130 C 126 127 132 130 134 136 L 143 156 L 148 167 L 140 167 L 135 158 C 127 158 120 152 120 142 L 119 136 Z" />
      <path d="M 128 140 L 136 154 M 126 157 L 124 160 M 131 157 L 130 160" fill="none" stroke="#6b3f07" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="125" cy="134.5" r="1.4" fill="#3a2104" stroke="none" />
      <line x1="122.5" y1="133" x2="127.5" y2="133.5" stroke="#3a2104" stroke-width="1.5" stroke-linecap="round" />

      <!-- Bird 3 -->
      <path d="M 152 133 L 157 130 C 162 127 168 130 170 136 L 179 156 L 184 167 L 176 167 L 171 158 C 163 158 156 152 156 142 L 155 136 Z" />
      <path d="M 164 140 L 172 154 M 162 157 L 160 160 M 167 157 L 166 160" fill="none" stroke="#6b3f07" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="161" cy="134.5" r="1.4" fill="#3a2104" stroke="none" />
      <line x1="158.5" y1="133" x2="163.5" y2="133.5" stroke="#3a2104" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Cyan ECG / CGM glucose spike waveform -->
    <polyline
      points="76,178 112,178 117,172 122,185 127,164 133,191 138,173 143,178 180,178"
      fill="none"
      stroke="#38d9f0"
      stroke-width="3.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Five crisp ivory diamond lozenges (classic Dabney crest fess) -->
    <g fill="#f8f5e6">
      <polygon points="94,199 99,207 94,215 89,207" />
      <polygon points="111,199 116,207 111,215 106,207" />
      <polygon points="128,199 133,207 128,215 123,207" />
      <polygon points="145,199 150,207 145,215 140,207" />
      <polygon points="162,199 167,207 162,215 157,207" />
    </g>
  </g>
</svg>
