[package]
name = "dabney-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tyler Port — resume & freelance software engineering, as a multiplatform Tauri app."

# `staticlib`/`cdylib` are required for the mobile (iOS/Android) entry points.
[lib]
name = "dabney_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
