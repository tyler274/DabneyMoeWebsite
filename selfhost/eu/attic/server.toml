# Attic server configuration for selfhost/eu. Secrets are not here:
#   ATTIC_SERVER_DATABASE_URL                 postgres://attic:<password>@postgres/attic
#   ATTIC_SERVER_TOKEN_RS256_SECRET_BASE64    token signing key (openssl genrsa -traditional 4096 | base64 -w0)
# both come from secrets.env.
listen = "[::]:8080"
api-endpoint = "https://cache.dabney.moe/"

[database]

[storage]
type = "local"
path = "/var/lib/attic/storage"

[chunking]
nar-size-threshold = 65536
min-size = 16384
avg-size = 65536
max-size = 262144

[compression]
type = "zstd"

[garbage-collection]
interval = "12 hours"
default-retention-period = "6 months"
