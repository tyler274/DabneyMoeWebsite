[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clinical-workspace = { path = "../clinical-workspace" }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
csv = "1.3"
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { workspace = true, optional = true }
# JS interop for the Tauri native-opener click handler (WASM builds only).
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Document",
  "Element",
  "ErrorEvent",
  "Event",
  "File",
  "FileList",
  "FileReader",
  "Headers",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "MouseEvent",
  "PromiseRejectionEvent",
  "ProgressEvent",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "WebGl2RenderingContext",
  "Window",
] }
wasm-bindgen = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
glow = "0.18"
glam = "0.30"

[features]
default = []
# Client-side rendering (used by the Tauri/Trunk build).
csr = ["leptos/csr", "js-sys", "web-sys", "wasm-bindgen"]
# Browser hydration of server-rendered HTML (used by the web build).
hydrate = ["leptos/hydrate", "js-sys", "web-sys", "wasm-bindgen"]
# Server-side rendering (used by the Axum server).
ssr = [
  "dep:tokio",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]
