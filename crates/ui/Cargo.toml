[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
csv = "1.3"
# JS interop for the Tauri native-opener click handler (WASM builds only).
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Document",
  "Element",
  "File",
  "FileList",
  "FileReader",
  "HtmlInputElement",
  "ProgressEvent",
  "Window",
] }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = []
# Client-side rendering (used by the Tauri/Trunk build).
csr = ["leptos/csr", "js-sys", "web-sys", "wasm-bindgen"]
# Browser hydration of server-rendered HTML (used by the web build).
hydrate = ["leptos/hydrate", "js-sys", "web-sys", "wasm-bindgen"]
# Server-side rendering (used by the Axum server).
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]
