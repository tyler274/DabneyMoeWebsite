[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "validate-cgm"
path = "src/bin/validate_cgm.rs"
required-features = ["ssr"]

[dependencies]
clinical-workspace = { path = "../clinical-workspace" }
recovery-index = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
csv = "1.3"
serde_json = { workspace = true }
serde = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { workspace = true, optional = true }
# JS interop for the Tauri native-opener click handler (WASM builds only).
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
  "Cache",
  "CacheStorage",
  "Coordinates",
  "Document",
  "Element",
  "ErrorEvent",
  "Event",
  "File",
  "FileList",
  "FileReader",
  "FocusOptions",
  "Geolocation",
  "Headers",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "Position",
  "PositionError",
  "PromiseRejectionEvent",
  "ProgressEvent",
  "Request",
  "RequestCache",
  "RequestInit",
  "RequestMode",
  "Response",
  "Storage",
  "Url",
  "WebGl2RenderingContext",
  "Window",
] }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
glow = "0.18"
glam = "0.30"

[features]
default = []
# Client-side rendering (used by the Tauri/Trunk build).
csr = ["leptos/csr", "js-sys", "web-sys", "wasm-bindgen", "wasm-bindgen-futures"]
# Browser hydration of server-rendered HTML (used by the web build).
hydrate = ["leptos/hydrate", "js-sys", "web-sys", "wasm-bindgen", "wasm-bindgen-futures"]
# Server-side rendering (used by the Axum server).
ssr = [
  "dep:tokio",
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
]
