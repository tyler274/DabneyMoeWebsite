[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ui = { workspace = true }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

# SSR-only (Axum server).
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
leptos_axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Hardened global allocator for the SSR server (`secure` => -DMI_SECURE:
# guard pages, encrypted free lists, randomized allocation, double-free
# detection). Only linked into the native server binary, never the wasm.
mimalloc = { version = "0.1", features = ["secure"], optional = true }

# Hydrate-only (WASM bundle).
wasm-bindgen = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }

[features]
default = ["ssr"]
hydrate = [
  "leptos/hydrate",
  "ui/hydrate",
  "dep:wasm-bindgen",
  "dep:console_error_panic_hook",
]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "ui/ssr",
  "dep:axum",
  "dep:tokio",
  "dep:leptos_axum",
  "dep:tower",
  "dep:tower-http",
  "dep:mimalloc",
]

[package.metadata.cargo-all-features]
denylist = ["axum", "tokio", "leptos_axum", "tower", "tower-http", "wasm-bindgen", "console_error_panic_hook", "mimalloc"]
