name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, lint, and test gate. Runs the exact same script as `nix run .#ci`
  # locally, so green-here means green-there.
  check:
    name: Format / Clippy / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Run CI gate (fmt + clippy + tests)
        run: nix run .#ci

  # Production web build (Axum SSR server binary + hashed site assets).
  build-web:
    name: Build web (Leptos SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: cargo leptos build --release
        run: nix develop -c cargo leptos build --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            target/site
            target/release/web
          if-no-files-found: error
          retention-days: 7

  # Desktop app: compile only (no OS packaging / bundling).
  build-desktop:
    name: Build desktop app (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: cargo tauri build --no-bundle
        run: nix develop -c cargo tauri build --no-bundle

  # Android app: cross-compile to an (unsigned) APK. `src-tauri/gen` is
  # git-ignored, so the Gradle/Android project is regenerated each run.
  build-android:
    name: Build Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: cargo tauri android init && build --apk
        run: |
          nix develop .#android -c bash -c '
            set -euo pipefail
            cargo tauri android init --skip-targets-install
            cargo tauri android build --apk
          '
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

  # Deploy on green main. The website ships to Google Cloud Run via the Nix
  # image + Terraform under ./terraform (default cloud = GCP; the AWS/Azure
  # modules are ready but their jobs stay gated). Play Store publishing remains
  # a placeholder pending the Play Console account.
  #
  # This job no-ops cleanly until the GCP secrets are set: add GCP_SA_KEY (a
  # service-account JSON key) and GCP_PROJECT, and — so state persists across
  # runs — uncomment the `gcs` backend in terraform/gcp/backend.tf.
  deploy:
    name: Deploy web (GCP Cloud Run)
    runs-on: ubuntu-latest
    needs: [check, build-web, build-desktop, build-android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check for GCP credentials
        id: creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP_SA_KEY not set; skipping web deploy. See terraform/README.md."
          fi

      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Build SSR server image
        if: steps.creds.outputs.configured == 'true'
        run: nix build .#serverImage

      - name: Terraform init
        if: steps.creds.outputs.configured == 'true'
        run: nix develop -c tofu -chdir=terraform/gcp init -input=false

      # Phase 1: ensure the Artifact Registry repo exists before pushing.
      - name: Terraform apply (registry)
        if: steps.creds.outputs.configured == 'true'
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          nix develop -c tofu -chdir=terraform/gcp apply -input=false -auto-approve \
            -var="project_id=$GCP_PROJECT" \
            -target=module.site.google_project_service.services \
            -target=module.site.google_artifact_registry_repository.repo

      - name: Push image to Artifact Registry
        if: steps.creds.outputs.configured == 'true'
        run: |
          REPO=$(nix develop -c tofu -chdir=terraform/gcp output -raw registry_repository_url)
          IMAGE="$REPO/web:$IMAGE_TAG"
          TOKEN=$(gcloud auth print-access-token)
          nix develop -c skopeo --insecure-policy copy --dest-creds "oauth2accesstoken:$TOKEN" \
            docker-archive:result "docker://$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Phase 2: roll the service out to the freshly-pushed image.
      - name: Terraform apply (service)
        if: steps.creds.outputs.configured == 'true'
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
        run: |
          nix develop -c tofu -chdir=terraform/gcp apply -input=false -auto-approve \
            -var="project_id=$GCP_PROJECT" \
            -var="image=$IMAGE"

      # To deploy to AWS or Azure instead, mirror the steps above against
      # terraform/aws or terraform/azure (the modules are ready): build
      # .#serverImage, push to ECR/ACR with skopeo, and run the two-phase
      # `tofu apply`. See terraform/README.md.

      - name: Publish app
        run: |
          echo "TODO: sign + publish the Android app to Google Play."
          echo "Pending Play Console account; add ANDROID_KEYSTORE_BASE64,"
          echo "ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and a Play service account JSON,"
          echo "then run the AAB upload (e.g. r0adkll/upload-google-play) here."
