name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, lint, and test gate. Runs the exact same script as `nix run .#ci`
  # locally, so green-here means green-there.
  check:
    name: Format / Clippy / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Run CI gate (fmt + clippy + tests)
        run: nix run .#ci

  # Production web build (Axum SSR server binary + hashed site assets).
  build-web:
    name: Build web (Leptos SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: cargo leptos build --release
        run: nix develop -c cargo leptos build --release
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            target/site
            target/release/web
          if-no-files-found: error
          retention-days: 7

  # Desktop app: compile only (no OS packaging / bundling).
  build-desktop:
    name: Build desktop app (Tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: cargo tauri build --no-bundle
        run: nix develop -c cargo tauri build --no-bundle

  # Android app: cross-compile to an (unsigned) APK. `src-tauri/gen` is
  # git-ignored, so the Gradle/Android project is regenerated each run.
  build-android:
    name: Build Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: cargo tauri android init && build --apk
        run: |
          nix develop .#android -c bash -c '
            set -euo pipefail
            cargo tauri android init --skip-targets-install
            cargo tauri android build --apk
          '
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

  # Deploy on green main. Infra (Artifact Registry, the Cloud Run service,
  # Cloudflare DNS, the domain mapping) is provisioned out-of-band by Terraform
  # under ./terraform; this job only builds the Nix image, pushes it, and rolls a
  # new Cloud Run revision (`gcloud run deploy`). The Cloud Run module ignores
  # image drift, so CI and Terraform don't fight over the running revision.
  #
  # Secrets come from Doppler: the only GitHub secret is DOPPLER_TOKEN (a
  # read-only service token, created by Terraform). `doppler run` injects
  # GCP_SA_KEY, GCP_PROJECT_ID, and GCP_REGION at runtime. The job no-ops cleanly
  # until DOPPLER_TOKEN is set.
  deploy:
    name: Deploy web (GCP Cloud Run)
    runs-on: ubuntu-latest
    # Add back in build-android when we have a way to sign the APK. 
    needs: [check, build-web, build-desktop]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Check for Doppler token
        id: creds
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOPPLER_TOKEN not set; skipping web deploy. See terraform/README.md."
          fi

      # Build the image, push it (by commit SHA + latest), and roll a new
      # Cloud Run revision. gcloud/skopeo/doppler all come from the Nix dev
      # shell; Doppler injects the GCP creds + project/region.
      - name: Build, push, and deploy revision
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          nix develop -c doppler run -- bash -euo pipefail -c '
            printf "%s" "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json"
            gcloud config set project "$GCP_PROJECT_ID"

            nix build .#serverImage

            REPO="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/dabney"
            IMAGE="$REPO/web:$GITHUB_SHA"
            TOKEN="$(gcloud auth print-access-token)"
            skopeo --insecure-policy copy --dest-creds "oauth2accesstoken:$TOKEN" docker-archive:result "docker://$IMAGE"
            skopeo --insecure-policy copy --dest-creds "oauth2accesstoken:$TOKEN" docker-archive:result "docker://$REPO/web:latest"

            gcloud run deploy dabney-web --image "$IMAGE" --region "$GCP_REGION" --quiet
          '

      - name: Publish app
        run: |
          echo "TODO: sign + publish the Android app to Google Play."
          echo "Pending Play Console account; add ANDROID_KEYSTORE_BASE64,"
          echo "ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and a Play service account JSON,"
          echo "then run the AAB upload (e.g. r0adkll/upload-google-play) here."
