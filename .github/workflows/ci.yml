name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # Required by DeterminateSystems/nix-installer-action for FlakeHub OIDC auth.
  id-token: write
  # read: pull the CI base image from GHCR.
  # write: push the bootstrapped image on first run / under act.
  packages: write
# The CI base image (built by ci-image.yml / the bootstrap job in this file)
# ships Nix (single-user), Node 24, and the entire Cargo.lock closure
# pre-vendored at /ci-cargo-vendor.  Every container job can therefore:
#   • call `nix` commands directly  - no nix-installer-action overhead
#   • run `cargo` fully offline     - no crates.io fetching, no HTTP/2 flakiness

# NOTE: do NOT declare `env: ACT: ''` here. nektos/act injects ACT=true into
# the environment when running locally, and the `env.ACT` checks below read
# that. The Determinate nix-installer detects the *presence* of $ACT (not its
# value), so exporting an empty ACT on GitHub's own runners makes the installer
# think it's under act and skip the systemd Nix daemon - which then never
# starts (no daemon-socket), hanging every later `nix` command. Leaving ACT
# undefined means: real runners → installer uses systemd; act → ACT=true set by
# act itself. Undefined `env.ACT` still compares equal to '' in expressions.
jobs:
  # Bootstrap the CI base image when it doesn't already exist.
  #
  # On GitHub Actions the job checks whether the Cargo.lock-pinned image tag is
  # already present in GHCR; if it is the whole job is a no-op (fast path).  If
  # it isn't (first push, or after a Cargo.lock bump) it installs Nix, vendors
  # the Cargo closure, and builds+pushes the image exactly as ci-image.yml does.
  #
  # Under act (local testing) the bootstrap job builds a minimal Nix image into
  # the local Docker daemon when no *working* image is present; `.actrc` sets
  # `--pull=false` so container jobs use that local tag instead of GHCR.
  build-ci-image:
    name: Bootstrap CI base image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Fast-path: skip only when a local image actually runs `nix`. A stale tag
      # (partial pull, old bootstrap) can exist without a working Nix install.
      - name: Check if image already exists
        id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci
        run: |
          TAG_HASH="${IMAGE}:${{ hashFiles('**/Cargo.lock') }}"
          image_ready() {
            docker image inspect "$1" > /dev/null 2>&1 \
              && docker run --rm "$1" nix --version > /dev/null 2>&1
          }
          if image_ready "${IMAGE}:latest"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif image_ready "$TAG_HASH"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$TAG_HASH" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # === Local act path =====================================================
      # Build an image with Nix pre-installed directly from the Docker daemon.
      # No Cargo vendoring (downstream jobs fetch as needed for local testing).
      # Building from a heredoc avoids Docker-in-Docker complexity.
      - name: Build minimal CI image (act)
        if: steps.check.outputs.skip != 'true' && env.ACT != ''
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest \
            -t "ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:${{ hashFiles('**/Cargo.lock') }}" \
            -f - . <<'DOCKERFILE'
          FROM ubuntu:22.04
          ARG DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
           && apt-get install -y --no-install-recommends \
                bash ca-certificates curl git sudo xz-utils \
           && curl -fsSL https://deb.nodesource.com/setup_24.x | bash - \
           && apt-get install -y nodejs \
           && rm -rf /var/lib/apt/lists/*
          RUN echo 'root ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
          RUN curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
           | sh -s -- install linux \
               --init none \
               --no-confirm \
               --extra-conf "sandbox = false" \
               --extra-conf "experimental-features = nix-command flakes"
          ENV PATH=/nix/var/nix/profiles/default/bin:$PATH
          ENV SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          RUN git config --system --add safe.directory '*'
          DOCKERFILE
      # === GitHub Actions path ===============================================
      # Build the full image with the pre-vendored Cargo closure so every
      # downstream job runs `cargo` commands fully offline.
      - uses: DeterminateSystems/nix-installer-action@v22
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
      # Probe readiness with Nix's own command instead of a hardcoded socket
      # path: Determinate Nix doesn't create /nix/var/nix/daemon-socket/socket,
      # so polling that file times out. `nix store info` returns 0 once the
      # store (daemon or local) is reachable.
      - name: Wait for Nix to be ready
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'
      - name: Build Cargo vendor dir
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        run: |
          nix build .#cargoVendorDir --out-link cargo-vendor-result
          cp -rL cargo-vendor-result cargo-vendor
          STORE_PATH=$(readlink -f cargo-vendor-result)
          sed "s|${STORE_PATH}|/ci-cargo-vendor|g" \
            cargo-vendor-result/config.toml > cargo-home-config.toml
      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        uses: docker/setup-buildx-action@v3
      - name: Build and push CI image
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
            ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:${{ hashFiles('**/Cargo.lock') }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
          cache-to: type=inline
  # Quick format check: rustfmt + nixpkgs-fmt. Fast gate that catches style
  # issues before we spend time on linting or building.
  # The CI image ships Nix but not the dev-shell tools; invoke them via
  # `nix develop -c` so the same toolchain runs locally, under act, and on GH.
  format:
    name: Format (rustfmt + nixpkgs-fmt)
    needs: [build-ci-image]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: Check nixpkgs-fmt
        run: nix develop -c nixpkgs-fmt --check flake.nix nix/
      - name: Check rustfmt
        run: nix develop -c cargo fmt --all --check
  # Clippy lint gate. Runs after format passes.
  clippy:
    name: Clippy
    needs: [format]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: "clippy: ui (ssr)"
        run: nix develop -c cargo clippy -p ui --features ssr -- -D warnings
      - name: "clippy: web (ssr)"
        run: nix develop -c cargo clippy -p web --features ssr -- -D warnings
      - name: "clippy: tauri-ui (csr, wasm32)"
        run: nix develop -c cargo clippy -p tauri-ui --target wasm32-unknown-unknown -- -D warnings
      - name: "clippy: dabney-app"
        run: nix develop -c cargo clippy -p dabney-app -- -D warnings
      - name: "clippy: icon-gen"
        run: nix develop -c cargo clippy -p icon-gen -- -D warnings
  # Production web build (Axum SSR server binary + hashed site assets).
  build-web:
    name: Build web (Leptos SSR)
    needs: [clippy]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: cargo leptos build --release
        run: nix develop -c cargo leptos build --release
      # act's built-in artifact server doesn't speak the upload-artifact@v7
      # protocol (rejects the `mime_type` field), so skip uploads under act.
      # The build itself is what we validate locally; artifacts are only needed
      # by the GitHub-hosted deploy job.
      - name: Upload web artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            target/site
            target/release/web
          if-no-files-found: error
          retention-days: 7
  # Desktop app: compile only (no OS packaging / bundling).
  build-desktop:
    name: Build desktop app (Tauri)
    needs: [clippy]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: cargo tauri build --no-bundle
        run: nix develop -c cargo tauri build --no-bundle
  # Android app: cross-compile to an (unsigned) APK. `src-tauri/gen` is
  # git-ignored, so the Gradle/Android project is regenerated each run.
  build-android:
    name: Build Android app (APK)
    needs: [clippy]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      # Generate the Android project first so gradle-wrapper.properties exists
      # before the Gradle cache steps derive their keys from it.
      - name: cargo tauri android init
        run: |
          nix develop .#android -c bash -c '
            set -euo pipefail
            cargo tauri android init --skip-targets-install
          '
      # Cache the Gradle wrapper distribution. Key is derived from the actual
      # gradle-wrapper.properties produced by init, so it bumps automatically
      # whenever Tauri generates a newer Gradle version.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v5
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-
      # Cache the Gradle dependency / build-tool JARs downloaded via Maven.
      - name: Cache Gradle caches
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/Cargo.toml') }}
          restore-keys: gradle-caches-
      - name: cargo tauri android build --apk
        run: |
          nix develop .#android -c bash -c '
            set -euo pipefail
            cargo tauri android build --apk
          '
      - name: Upload Android APK artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
  # Test suite. Runs after web build finishes (uses the built artifacts).
  test:
    name: Test suite
    needs: [build-web]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: "test: ui (data + ssr render)"
        run: nix develop -c cargo test -p ui --features ssr
      - name: "test: web (ssr route list)"
        run: nix develop -c cargo test -p web --features ssr
      - name: "test: dabney-app (tauri context)"
        run: nix develop -c cargo test -p dabney-app
  # Build the production OCI image (Nix). Only runs if web builds AND tests pass.
  build-image:
    name: Build server OCI image
    needs: [test]
    runs-on: ubuntu-latest
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: nix build .#serverImage
        run: |
          nix build .#serverImage
          # `result` is a symlink into the Nix store; -L dereferences it.
          cp -L result server-image.tar.gz
      - if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: server-image.tar.gz
          if-no-files-found: error
          retention-days: 1
  # Deploy on green main. Infra (Artifact Registry, the Cloud Run service,
  # Cloudflare DNS, the domain mapping) is provisioned out-of-band by Terraform
  # under ./terraform; this job downloads the pre-built image artifact, pushes
  # it, and rolls a new Cloud Run revision (`gcloud run deploy`). No `nix build`
  # here, so a slow rebuild cannot stall the deploy.
  #
  # Secrets come from Doppler: the only GitHub secret is DOPPLER_TOKEN (a
  # read-only service token, created by Terraform). `doppler run` injects
  # GCP_SA_KEY, GCP_PROJECT_ID, and GCP_REGION at runtime. The job no-ops
  # cleanly until DOPPLER_TOKEN is set.
  deploy:
    name: Deploy web (GCP Cloud Run)
    runs-on: ubuntu-latest
    # Deploy only after: check (format+clippy), all builds, test, and image build pass
    needs: [clippy, build-web, test, build-image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Wait for Nix to be ready
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'
      - name: Download server image artifact
        uses: actions/download-artifact@v8
        with:
          name: server-image
      - name: Check for Doppler token
        id: creds
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOPPLER_TOKEN not set; skipping web deploy. See terraform/README.md."
          fi
      # Push the pre-built image (by commit SHA + latest) and roll a new Cloud
      # Run revision. gcloud/skopeo/doppler come from the Nix dev shell;
      # Doppler injects the GCP creds + project/region.
      - name: Push image and deploy revision
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          nix develop -c doppler run -- bash -euo pipefail -c '
            printf "%s" "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json"
            gcloud config set project "$GCP_PROJECT_ID"

            # The ubuntu-latest runner ships a v1 /etc/containers/registries.conf
            # but the Nix-provided skopeo requires v2. Write a minimal v2 TOML
            # config to a temp file and point CONTAINERS_REGISTRIES_CONF at it.
            # Note: no single-quotes inside this outer bash -c string.
            REGISTRIES_CONF="$RUNNER_TEMP/registries.conf"
            printf "unqualified-search-registries = []\n" > "$REGISTRIES_CONF"
            export CONTAINERS_REGISTRIES_CONF="$REGISTRIES_CONF"

            REPO="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/dabney"
            IMAGE="$REPO/web:$GITHUB_SHA"
            TOKEN="$(gcloud auth print-access-token)"
            skopeo --insecure-policy copy --dest-creds "oauth2accesstoken:$TOKEN" docker-archive:server-image.tar.gz "docker://$IMAGE"
            skopeo --insecure-policy copy --dest-creds "oauth2accesstoken:$TOKEN" docker-archive:server-image.tar.gz "docker://$REPO/web:latest"

            gcloud run deploy dabney-web --image "$IMAGE" --region "$GCP_REGION" --quiet
          '
      - name: Publish app
        run: |
          echo "TODO: sign + publish the Android app to Google Play."
          echo "Pending Play Console account; add ANDROID_KEYSTORE_BASE64,"
          echo "ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and a Play service account JSON,"
          echo "then run the AAB upload (e.g. r0adkll/upload-google-play) here."
