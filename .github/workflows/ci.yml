name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Only a newer revision of the same pull request cancels a run. Pushes to main
# and manual runs each get their own group, so a run that is already deploying
# is never cancelled by the next push.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  # Required by DeterminateSystems/nix-installer-action for FlakeHub OIDC auth.
  id-token: write
  # read: pull the CI base image from GHCR.
  # write: push the bootstrapped image on first run / under act.
  packages: write
# The CI base image (built by ci-image.yml / the bootstrap job in this file)
# ships Nix (single-user), Node 24, and the entire Cargo.lock closure
# pre-vendored at /ci-cargo-vendor.  Every container job can therefore:
#   • call `nix` commands directly  - no nix-installer-action overhead
#   • run `cargo` fully offline     - no crates.io fetching, no HTTP/2 flakiness

# NOTE: do NOT declare `env: ACT: ''` here. nektos/act injects ACT=true into
# the environment when running locally, and the `env.ACT` checks below read
# that. The Determinate nix-installer detects the *presence* of $ACT (not its
# value), so exporting an empty ACT on GitHub's own runners makes the installer
# think it's under act and skip the systemd Nix daemon - which then never
# starts (no daemon-socket), hanging every later `nix` command. Leaving ACT
# undefined means: real runners → installer uses systemd; act → ACT=true set by
# act itself. Undefined `env.ACT` still compares equal to '' in expressions.

# Job graph: `scope` and the image bootstrap run first, then format, clippy,
# test, build-image, and any affected app builds run in parallel. `build-image`
# already runs `cargo leptos build --release` (WASM hydrate + Tailwind + asset
# hashing + static-musl SSR server), so there is no separate duplicate
# `build-web` job. `deploy` waits for format, clippy, test, and build-image, so
# wall time is the slowest gate, not the sum.
#
# Rust build cache: clippy, test, and build-desktop restore `target/`
# keyed by job, rustc version, flake.lock and Cargo.lock. The fallback key
# keeps flake.lock: cached build scripts and proc macros link against the
# pinned glibc store path and cannot run after a nixpkgs bump. Crate sources are vendored in the
# CI image, so there is no registry to cache. Only runs on main save, after
# scripts/ci-trim-target.sh strips workspace outputs, so pull requests read the
# cache without filling the 10 GB repository limit. Cache steps never fail a
# job (`continue-on-error`) and are skipped under act, like artifact uploads.
jobs:
  # Decide which jobs this change needs. Changes confined to Markdown,
  # terraform/ and selfhost/ skip every build and the deploy; Android builds
  # only when its inputs changed. See scripts/ci_scope.py. Anything that cannot
  # be compared (manual runs, act, missing history) runs everything.
  scope:
    name: Select CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      desktop: ${{ steps.select.outputs.desktop }}
      android: ${{ steps.select.outputs.android }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify the change
        id: select
        run: |
          if ! python3 scripts/ci_scope.py; then
            echo "::warning::CI scope selection failed; running every job."
            printf 'build=true\ndesktop=true\nandroid=true\n' >> "$GITHUB_OUTPUT"
          fi
  # Bootstrap the CI base image when it doesn't already exist.
  #
  # On GitHub Actions the job checks whether the Cargo.lock-pinned image tag is
  # already present in GHCR; if it is the whole job is a no-op (fast path).  If
  # it isn't (first push, or after a Cargo.lock bump) it installs Nix, vendors
  # the Cargo closure, and builds+pushes the image exactly as ci-image.yml does.
  #
  # Under act (local testing) the bootstrap job builds a minimal Nix image into
  # the local Docker daemon when no *working* image is present; `.actrc` sets
  # `--pull=false` so container jobs use that local tag instead of GHCR.
  build-ci-image:
    name: Bootstrap CI base image
    needs: [scope]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      # The GHCR package is private, so the registry lookup below needs a login.
      - name: Log in to GHCR
        if: env.ACT == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Fast-path: skip when the image for this Cargo.lock + ci.Dockerfile is
      # already in GHCR (or, under act, in the local Docker daemon and able to
      # run `nix`; a stale tag can exist without a working Nix install).
      #
      # The tag is computed here, before the vendor dir exists, and reused when
      # pushing. Hashing `**/Cargo.lock` again after vendoring also picks up
      # lockfiles shipped inside vendored crates, so the pushed tag never
      # matched this lookup and the image was rebuilt on every run.
      #
      # Container jobs run the pinned tag from this job's `image` output, not
      # `latest`: `latest` may have been pushed by a branch with another
      # Cargo.lock, whose vendored crates would not satisfy an offline build.
      - name: Check if image already exists
        id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/dabneymoe-ci
          TAG: ${{ hashFiles('Cargo.lock', 'ci.Dockerfile') }}
        run: |
          TAG_HASH="${IMAGE}:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          image_ready() {
            docker image inspect "$1" > /dev/null 2>&1 \
              && docker run --rm "$1" nix --version > /dev/null 2>&1
          }
          ref="$TAG_HASH"
          if image_ready "$TAG_HASH"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$TAG_HASH" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACT:-}" ] && image_ready "${IMAGE}:latest"; then
            # Local runs reuse whatever working image is already loaded.
            ref="${IMAGE}:latest"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "image=${ref}" >> "$GITHUB_OUTPUT"
      # === Local act path =====================================================
      # Build an image with Nix pre-installed directly from the Docker daemon.
      # No Cargo vendoring (downstream jobs fetch as needed for local testing).
      # Building from a heredoc avoids Docker-in-Docker complexity.
      - name: Build minimal CI image (act)
        if: steps.check.outputs.skip != 'true' && env.ACT != ''
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest \
            -t "ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:${{ steps.check.outputs.tag }}" \
            -f - . <<'DOCKERFILE'
          FROM ubuntu:22.04
          ARG DEBIAN_FRONTEND=noninteractive
          RUN apt-get update \
           && apt-get install -y --no-install-recommends \
                bash ca-certificates curl git sudo xz-utils \
           && curl -fsSL https://deb.nodesource.com/setup_24.x | bash - \
           && apt-get install -y nodejs \
           && rm -rf /var/lib/apt/lists/*
          RUN echo 'root ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
          RUN curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix \
           | sh -s -- install linux \
               --init none \
               --no-confirm \
               --extra-conf "sandbox = false" \
               --extra-conf "experimental-features = nix-command flakes"
          ENV PATH=/nix/var/nix/profiles/default/bin:$PATH
          ENV SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          RUN git config --system --add safe.directory '*'
          DOCKERFILE
      # === GitHub Actions path ===============================================
      # Build the full image with the pre-vendored Cargo closure so every
      # downstream job runs `cargo` commands fully offline.
      - uses: DeterminateSystems/nix-installer-action@v22
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
      # Probe readiness with Nix's own command instead of a hardcoded socket
      # path: Determinate Nix doesn't create /nix/var/nix/daemon-socket/socket,
      # so polling that file times out. `nix store info` returns 0 once the
      # store (daemon or local) is reachable.
      - name: Wait for Nix to be ready
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'
      - name: Magic Nix Cache
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        continue-on-error: true
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - name: Build Cargo vendor dir
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        run: |
          nix build .#cargoVendorDir --out-link cargo-vendor-result
          cp -rL cargo-vendor-result cargo-vendor
          STORE_PATH=$(readlink -f cargo-vendor-result)
          sed "s|${STORE_PATH}|/ci-cargo-vendor|g" \
            cargo-vendor-result/config.toml > cargo-home-config.toml
      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        uses: docker/setup-buildx-action@v3
      - name: Build and push CI image
        if: steps.check.outputs.skip != 'true' && env.ACT == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
            ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:${{ steps.check.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
          cache-to: type=inline
  # Quick format check: rustfmt + nixpkgs-fmt.
  # The CI image ships Nix but not the dev-shell tools; invoke them via
  # `nix develop -c` so the same toolchain runs locally, under act, and on GH.
  format:
    name: Format (rustfmt + nixpkgs-fmt)
    needs: [scope, build-ci-image]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: Check nixpkgs-fmt, rustfmt, and yamlfmt
        run: nix run .#format-check
  # RustSec advisories, licence allow-list, bans and source checks. deny.toml is
  # the single policy file; the dev shell carries cargo-deny too, so
  # `nix develop -c cargo deny --all-features check` and `nix run .#ci` match
  # this job. It needs neither the CI image nor a build, so it runs beside the
  # image bootstrap. Deliberately not in `deploy.needs`: a newly published
  # advisory must not block a deploy of otherwise unchanged code.
  cargo-deny:
    name: Dependency guardrails (cargo-deny)
    needs: [scope]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned Rust version
        id: toolchain
        run: python3 -c 'import tomllib; print("channel=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - name: Check dependency guardrails
        uses: EmbarkStudios/cargo-deny-action@v2
        # The action's image ships an older Rust. Install the pin minimally and
        # use it instead of letting rustup pull the full toolchain file profile.
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        with:
          rust-version: ${{ steps.toolchain.outputs.channel }}
          command: check
          # `arguments` is the argv head (before `check`); `command-arguments`
          # land after it. `--all-features` must come before `check`.
          arguments: --all-features
          command-arguments: advisories bans licenses sources
  # Clippy lint gate.
  clippy:
    name: Clippy
    needs: [scope, build-ci-image]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Dependencies come from the cache and CI never rebuilds incrementally;
      # debug info only makes the cached target/ larger.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: Rust toolchain version
        id: rustc
        run: |
          version="$(nix develop .#ci -c rustc -vV | awk '/^release:/{r=$2} /^commit-hash:/{c=$2} END{print r "-" substr(c,1,12)}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: target
          key: rust-v2-clippy-${{ steps.rustc.outputs.version }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-v2-clippy-${{ steps.rustc.outputs.version }}-${{ hashFiles('flake.lock') }}-
      - name: Run clippy across workspace crates
        run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo clippy -p recovery-index --features cli -- -D warnings
            cargo clippy -p recovery-index --target wasm32-unknown-unknown -- -D warnings
            cargo clippy -p clinical-workspace --features ssr -- -D warnings
            cargo clippy -p ui --features ssr -- -D warnings
            cargo clippy -p web --features ssr -- -D warnings
            cargo clippy -p tauri-ui --target wasm32-unknown-unknown -- -D warnings
            cargo clippy -p dabney-app -- -D warnings
            cargo clippy -p dabney-app --features health-connect -- -D warnings
            cargo clippy -p icon-gen -- -D warnings
            cargo clippy -p forge-linear-sync --all-targets -- -D warnings
            cargo clippy -p forge --all-targets -- -D warnings
          '
      - name: Prepare Rust cache payload
        id: cache-payload
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: scripts/ci-trim-target.sh target
      - name: Save Rust build cache
        if: ${{ steps.cache-payload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  # Desktop app: compile only (no OS packaging / bundling).
  build-desktop:
    name: Build desktop app (Tauri)
    needs: [scope, build-ci-image]
    if: needs.scope.outputs.build == 'true' && needs.scope.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: Rust toolchain version
        id: rustc
        run: |
          version="$(nix develop -c rustc -vV | awk '/^release:/{r=$2} /^commit-hash:/{c=$2} END{print r "-" substr(c,1,12)}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: target
          key: rust-v1-build-desktop-${{ steps.rustc.outputs.version }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-v1-build-desktop-${{ steps.rustc.outputs.version }}-${{ hashFiles('flake.lock') }}-
      - name: cargo tauri build --no-bundle
        run: nix develop -c cargo tauri build --no-bundle
      - name: Prepare Rust cache payload
        id: cache-payload
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: scripts/ci-trim-target.sh target
      - name: Save Rust build cache
        if: ${{ steps.cache-payload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  # Android app: cross-compile to an (unsigned) APK. `src-tauri/gen` is
  # git-ignored, so the Gradle/Android project is regenerated each run.
  build-android:
    name: Build Android app (APK)
    needs: [scope, build-ci-image]
    if: needs.scope.outputs.build == 'true' && needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      # Generate the Android project first so gradle-wrapper.properties exists
      # before the Gradle cache steps derive their keys from it.
      - name: cargo tauri android init
        run: |
          nix develop .#android -c bash -c '
            set -euo pipefail
            cargo tauri android init --skip-targets-install
          '
      # Cache the Gradle wrapper distribution. Key is derived from the actual
      # gradle-wrapper.properties produced by init, so it bumps automatically
      # whenever Tauri generates a newer Gradle version.
      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-
      # Cache the Gradle dependency / build-tool JARs downloaded via Maven.
      - name: Cache Gradle caches
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties', 'src-tauri/Cargo.toml') }}
          restore-keys: gradle-caches-
      - name: Build & verify Android release AAB (16 KB + zero-PHI manifest checks)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          nix develop .#android -c bash -c '
            set -euo pipefail
            scripts/android-release.sh --aab
          '
      - name: Upload Android AAB artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 7
  # Test suite.
  test:
    name: Test suite
    needs: [scope, build-ci-image]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # act sometimes drops Dockerfile ENV; keep Nix on PATH.
      PATH: /nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Dependencies come from the cache (at opt-level = 2 via Cargo.toml) and
      # CI never rebuilds incrementally; skip debug info and workspace
      # optimization so `ui`/`web` test binaries compile in seconds instead of
      # 10+ minutes.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - name: Trust workspace for Git
        run: git config --system --add safe.directory '*'
      - name: Rust toolchain version
        id: rustc
        run: |
          version="$(nix develop .#ci -c rustc -vV | awk '/^release:/{r=$2} /^commit-hash:/{c=$2} END{print r "-" substr(c,1,12)}')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        id: rust-cache
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: target
          key: rust-v2-test-${{ steps.rustc.outputs.version }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-v2-test-${{ steps.rustc.outputs.version }}-${{ hashFiles('flake.lock') }}-
      - name: Run workspace test suite
        run: |
          nix develop .#ci -c bash -euo pipefail -c '
            cargo test -p recovery-index --features cli
            cargo test -p clinical-workspace --features ssr
            cargo test -p ui --features ssr
            cargo test -p web --features ssr
            cargo test -p dabney-app
            cargo test -p dabney-app --features health-connect
            cargo test -p forge-linear-sync
            cargo test -p forge
          '
      - name: Prepare Rust cache payload
        id: cache-payload
        if: ${{ !env.ACT && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.rust-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: scripts/ci-trim-target.sh target
      - name: Save Rust build cache
        if: ${{ steps.cache-payload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  # Build the production OCI image (Nix). Runs on the host runner with the Nix
  # daemon + Magic Nix Cache so `cargoVendorDir` and unchanged static musl
  # builds are cached across runs instead of rebuilt cold inside a container.
  build-image:
    name: Build server OCI image
    needs: [scope]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
        if: env.ACT == ''
      - name: Wait for Nix to be ready
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'
      - name: Magic Nix Cache
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - name: nix build .#serverImage
        run: |
          nix build .#serverImage
          # `result` is a symlink into the Nix store; -L dereferences it.
          cp -L result server-image.tar.gz
      # Under act the upload-artifact action is skipped (protocol mismatch), but
      # with `.actrc --bind` the tarball above is written straight to the host
      # workspace for local `docker load` smoke tests.
      - name: Verify server image export (act)
        if: env.ACT != ''
        run: |
          ls -lh server-image.tar.gz
          test -s server-image.tar.gz
      - if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: server-image.tar.gz
          if-no-files-found: error
          retention-days: 1
  # Deploy on green main. Infra (Artifact Registry, the Cloud Run service,
  # Cloudflare DNS, the domain mapping) is provisioned out-of-band by Terraform
  # under ./terraform; this job downloads the pre-built image artifact, pushes
  # it, and rolls a new Cloud Run revision (`gcloud run deploy`). No `nix build`
  # here, so a slow rebuild cannot stall the deploy.
  #
  # Secrets come from Doppler: the only GitHub secret is DOPPLER_TOKEN (a
  # read-only service token, created by Terraform). `doppler run` injects
  # GCP_SA_KEY, GCP_PROJECT_ID, and GCP_REGION at runtime. The job no-ops
  # cleanly until DOPPLER_TOKEN is set.
  deploy:
    name: Deploy web (GCP Cloud Run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy only after format, clippy, test, and the server image build all
    # succeeded. Each result is checked explicitly: a failed, cancelled or
    # skipped gate (for example a docs-only change, where `scope` skips the
    # builds) must skip the deploy rather than let it run.
    needs: [scope, format, clippy, test, build-image]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.scope.outputs.build == 'true' && needs.format.result == 'success' && needs.clippy.result == 'success' && needs.test.result == 'success' && needs.build-image.result == 'success' }}
    # Main runs are no longer cancelled by the next push, so two deploys can
    # overlap. Run them one at a time.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Wait for Nix to be ready
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'
      # Caches the deploy shell closure in the Actions cache. Only this job uses
      # it: the container jobs run Nix single-user with no daemon, and the
      # action hangs there instead of starting.
      - name: Magic Nix Cache
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - name: Download server image artifact
        uses: actions/download-artifact@v8
        with:
          name: server-image
      - name: Check for Doppler token
        id: creds
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOPPLER_TOKEN not set; skipping web deploy. See terraform/README.md."
          fi
      # Push the pre-built image (by commit SHA + latest) and roll a new Cloud
      # Run revision. gcloud/skopeo/doppler come from the slim `deploy` dev shell
      # (not the full Rust/Tauri shell); Doppler injects the GCP creds +
      # project/region.
      - name: Push image and deploy revision
        if: steps.creds.outputs.configured == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          nix develop .#deploy -c doppler run -- bash -euo pipefail -c '
            printf "%s" "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp-sa.json"
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-sa.json"
            gcloud config set project "$GCP_PROJECT_ID"

            # The ubuntu-latest runner ships a v1 /etc/containers/registries.conf
            # but the Nix-provided skopeo requires v2. Write a minimal v2 TOML
            # config to a temp file and point CONTAINERS_REGISTRIES_CONF at it.
            # Note: no single-quotes inside this outer bash -c string.
            REGISTRIES_CONF="$RUNNER_TEMP/registries.conf"
            printf "unqualified-search-registries = []\n" > "$REGISTRIES_CONF"
            export CONTAINERS_REGISTRIES_CONF="$REGISTRIES_CONF"

            REPO="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/dabney"
            IMAGE="$REPO/web:$GITHUB_SHA"
            TOKEN="$(gcloud auth print-access-token)"
            skopeo --insecure-policy copy --dest-creds "oauth2accesstoken:$TOKEN" docker-archive:server-image.tar.gz "docker://$IMAGE"
            gcloud artifacts docker tags add "$IMAGE" "$REPO/web:latest" --quiet

            # Multi-container Cloud Run services (when the Anubis fallback sidecar
            # is enabled by Terraform) require updating the named `web` container
            # rather than calling single-container `gcloud run deploy --image`.
            if gcloud run services describe dabney-web --region "$GCP_REGION" --format="value(spec.template.spec.containers[].name)" 2>/dev/null | tr ";" "\n" | grep -qx "anubis"; then
              gcloud run services update dabney-web --region "$GCP_REGION" --quiet --container=web --image "$IMAGE"
            else
              gcloud run deploy dabney-web --image "$IMAGE" --region "$GCP_REGION" --quiet
            fi
          '
      - name: Publish Android app status
        run: |
          echo "Play-ready AAB (moe.dabney.demo) is built and verified by scripts/android-release.sh."
          echo "Complete the first manual Play Console upload per docs/google-play/README.md,"
          echo "then configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD,"
          echo "ANDROID_KEY_PASSWORD, and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON to enable automated Play uploads."
