name: Build and push CI base image

# Rebuild the GHCR CI image whenever the Cargo closure or the image definition
# itself changes, and weekly to pick up updated system packages (caniuse-lite,
# CA certs, etc.). All other CI jobs use this image as their container so that
# `cargo` runs fully offline — no crates.io fetching on hot paths.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "ci.Dockerfile"
      - "nix/ci-image.nix"
      - ".github/workflows/ci-image.yml"
  schedule:
    # 05:00 UTC every Sunday.
    - cron: "0 5 * * 0"
  workflow_dispatch:

# Do not declare `env: ACT: ''` — the Determinate nix-installer detects the
# mere presence of $ACT and would skip the systemd daemon on real runners,
# leaving no daemon socket. act sets ACT=true itself when running locally.

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required by DeterminateSystems/nix-installer-action for FlakeHub OIDC auth.
  id-token: write
  # Required to push to GHCR.
  packages: write

jobs:
  build-push:
    name: Build and push ci:latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      # Readiness probe via Nix's own `store info` rather than a hardcoded
      # daemon-socket path. Determinate Nix doesn't expose the legacy socket at
      # /nix/var/nix/daemon-socket/socket, so polling that file times out (exit
      # 124). `nix store info` works for both a daemon store (hosted runners)
      # and a local single-user store, and retries cover the act case where the
      # daemon comes up in the background after the installer step returns.
      - name: Wait for Nix to be ready
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'

      # Build the crane vendor dir from the flake. crane's `cargo vendor`
      # includes all platform-conditional deps (android, wasm32, etc.) in one
      # shot, so the resulting store path covers every cross-compilation target.
      - name: Build Cargo vendor dir
        run: |
          nix build .#cargoVendorDir --out-link cargo-vendor-result

          # Copy the vendor dir (dereference all symlinks so Docker can COPY it).
          cp -rL cargo-vendor-result cargo-vendor

          # Rewrite the Nix store path in config.toml to the stable in-image path
          # /ci-cargo-vendor so the config works regardless of the store hash.
          STORE_PATH=$(readlink -f cargo-vendor-result)
          sed "s|${STORE_PATH}|/ci-cargo-vendor|g" \
            cargo-vendor-result/config.toml > cargo-home-config.toml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci.Dockerfile
          push: true
          # Tag with the Cargo.lock hash so jobs can pin to a reproducible image
          # and with `latest` for convenience.
          tags: |
            ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
            ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:${{ hashFiles('**/Cargo.lock') }}
          # Layer caching: reuse layers from the previous push when only the
          # vendor dir changed (common case: a small Cargo.lock bump).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/dabneymoe-ci:latest
          cache-to: type=inline
