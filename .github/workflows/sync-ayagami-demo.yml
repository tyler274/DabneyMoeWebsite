name: Sync Ayagami demo
# Rebuild public/vtuber/demo/ from the Ayagami commit pinned in
# scripts/sync-ayagami-demo.sh and open a pull request when the output changes,
# so CI validates the viewer before merge. Run it after moving the pin.
on:
  workflow_dispatch:
concurrency:
  group: sync-ayagami-demo-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    name: Sync Ayagami model viewer
    runs-on: ubuntu-latest
    steps:
      - name: Check out DabneyMoeWebsite
        uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Wait for Nix to be ready
        run: timeout 120 bash -c 'until nix store info 2>/dev/null; do sleep 1; done'
      - name: Magic Nix Cache
        continue-on-error: true
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
      - name: Build the pinned Ayagami demo
        run: ./scripts/sync-ayagami-demo.sh
      - name: Open or update sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A public/vtuber/demo scripts/ayagami-demo.Cargo.lock
          if git diff --cached --quiet; then
            echo "public/vtuber/demo/ already matches the pinned Ayagami commit."
            exit 0
          fi
          AYAGAMI_SHA=$(sed -n 's/^AYAGAMI_REV="\(.\{10\}\).*/\1/p' scripts/sync-ayagami-demo.sh)
          BRANCH="sync/ayagami-demo-${AYAGAMI_SHA}"
          git checkout -B "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Ayagami model viewer (${AYAGAMI_SHA})"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"
          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync Ayagami model viewer (${AYAGAMI_SHA})" \
              --body "Automated rebuild of \`public/vtuber/demo/\` from \`AyagamiDev/ayagami@${AYAGAMI_SHA}\`."
          fi
