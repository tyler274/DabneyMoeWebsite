[package]
name = "harness"
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"


[dependencies]
agent-skills = { path = "../agent-skills" }
async-trait = "0.1"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

