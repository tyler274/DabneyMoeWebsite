[package]
name = "physician-demo-api"
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"


[dependencies]
agent-skills = { path = "../agent-skills" }
async-trait = "0.1"
axum = "0.8"
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
futures-util = "0.3"
harness = { path = "../harness" }
http = { path = "../http", package = "coda-http", features = ["ingress"] }
physician-bus = { path = "../physician-bus" }
physician-demo-db = { path = "../physician-demo-db" }
physician-wire = { path = "../physician-wire" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

