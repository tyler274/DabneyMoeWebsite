[package]
name = "physician-bus"
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"


[dependencies]
async-trait = "0.1"
fred = { version = "10", default-features = false, features = ["i-std", "i-pubsub", "subscriber-client", "enable-rustls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

