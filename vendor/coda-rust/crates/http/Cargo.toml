[package]
name = "coda-http"
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"


[features]
# Server-side Google IAP signed-header verification. Off by default so the
# browser clients that share this crate never compile it.
iap = ["dep:jsonwebtoken", "dep:tokio"]
# Server-side HTTP ingress rate-limiting, concurrency, and body-size guards.
ingress = ["dep:axum", "dep:tokio", "dep:tracing"]
# Public fixture key and signer for other crates' tests; `[dev-dependencies]` only.
test-util = ["iap", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
axum = { version = "0.8", optional = true }
base64 = { version = "0.23", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

