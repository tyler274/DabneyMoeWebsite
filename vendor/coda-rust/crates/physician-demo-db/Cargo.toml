[package]
name = "physician-demo-db"
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"


[dependencies]
physician-wire = { path = "../physician-wire" }
sea-query = "1.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
turso_core = { version = "0.8.4", default-features = false, features = ["fs", "json", "pure-rust-crypto", "uuid"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

